[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender_tools"
version = "0.1.0"
description = "Blender 5.x pipeline tools for IR-Unity-Research terrain + cinematic rendering"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "IR-Unity-Research" }]
license = { text = "Proprietary" }
dependencies = [
  "pyproj>=3.6",
  "numpy>=1.26",
  "trimesh>=4.0",
]

[project.optional-dependencies]
cad = [
  "cadquery-ocp>=7.9",
  "pymeshlab>=2023.12",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
blender-tools = "blender_tools.cli:main"

[tool.setuptools]
packages = ["blender_tools", "blender_tools.tests"]
package-dir = { "" = "." }

[tool.pytest.ini_options]
markers = [
  "needs_gdal: marks tests that require the GDAL CLI to be installed (deselect with -m 'not needs_gdal')",
]
